name: تحديث المواعيد ونشر الموقع

on:
  schedule:
    # كل ساعة عند الدقيقة 17 (GitHub يستخدم UTC، والتأخير لعدة دقايق طبيعي)
    - cron: "17 * * * *"
  workflow_dispatch: {}      # زر تشغيل يدوي من تبويب Actions
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**"]

permissions:
  contents: write   # عشان يحفظ ملف المواعيد الجديد في المستودع
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: الاختبارات
        run: |
          pip install pytest
          if [ -d tests ]; then python -m pytest -q tests; else echo "مجلد tests غير موجود، تم التخطي"; fi

      - name: سحب وتنظيف وتحديث
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python -m pipeline.run

      - name: حفظ البيانات الجديدة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/showtimes.json data/history
          [ -f data/movie_meta.json ] && git add data/movie_meta.json
          if git diff --cached --quiet; then
            echo "ما فيه تغيير"
          else
            git commit -m "تحديث المواعيد $(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
